services:
  web:
    build: .
    image: meow-moments:latest
    container_name: meow-moments
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      MEOW_DATA_DIR: /app/data
    ports:
      - "3000:3000"
    volumes:
      # Photos and voice notes. Keep this volume: it is the only copy of the data.
      - meow-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  meow-data:
