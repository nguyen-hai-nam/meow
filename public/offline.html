<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FF6B9D" />
    <title>Offline · Meow Moments</title>
    <style>
      :root {
        --pink: #ff6b9d;
        --gradient: linear-gradient(135deg, #ff6b9d 0%, #c44dff 50%, #ff8c42 100%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px
          calc(24px + env(safe-area-inset-bottom));
        background: #fff5f7;
        color: #374151;
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system,
          'Segoe UI', sans-serif;
        text-align: center;
      }

      .card {
        width: min(100%, 360px);
        padding: 40px 28px;
        background: #fff;
        border: 1px solid #ffe0ea;
        border-radius: 28px;
        box-shadow: 0 18px 45px rgba(196, 77, 255, 0.12);
      }

      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
        margin: 0 auto 22px;
        border-radius: 26px;
        background: var(--gradient);
        font-size: 44px;
        line-height: 1;
        box-shadow: 0 12px 28px rgba(255, 107, 157, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 700;
        color: #1f2937;
      }

      p {
        margin: 0 0 26px;
        font-size: 15px;
        line-height: 1.55;
        color: #6b7280;
      }

      button {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 16px;
        background: var(--gradient);
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 10px 22px rgba(255, 107, 157, 0.3);
      }

      button:active {
        transform: scale(0.97);
      }

      .hint {
        margin: 18px 0 0;
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">🐱</div>
      <h1>You're offline</h1>
      <p>
        Meow Moments needs a connection to load your moments. Check your signal
        and try again.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
      <p class="hint">Your moments will be here when you're back online.</p>
    </main>
  </body>
</html>
